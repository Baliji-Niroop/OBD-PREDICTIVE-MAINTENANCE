[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obd-predictive-maintenance"
version = "1.0.0"
description = "Explainable OBD-II health screening, fault findings, and interactive dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
    "scikit-learn",
    "streamlit",
    "plotly",
]

[project.scripts]
obd-diagnosis = "obd_predictive.obd_diagnosis:main"
obd-make-samples = "obd_predictive.make_sample_data:main"

[tool.setuptools.packages.find]
where = ["src"]
